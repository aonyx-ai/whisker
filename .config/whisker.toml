# Whisker reads this file when `whisker check` runs against this repository.
# The patterns below anchor at the repository root, not at `.config`.
# `/examples/` and the fixtures hold code that breaks whisker's own lints on
# purpose. `/docs/` is the documentation site: its TypeScript configuration
# extends a package that exists only after `npm install`, and the site's own
# build checks that code.
ignore = ["/docs/", "/examples/", "crates/whisker-rust/tests/fixtures/"]

# Every lint builds against the whisker in this directory, not against the
# whisker its own manifest names. The rules repository pins a whisker commit
# so that it can build on its own, and this overrides that pin, so a check
# here runs the rules against the working tree.
whisker-source = "."

# Whisker's rules live in their own repository, pinned to one commit. Bumping
# this is how whisker adopts a new rule or a changed one; until it moves, a
# check here runs exactly the rules it ran yesterday.
[[lints]]
git = "https://github.com/aonyx-ai/whisker-aonyx-rules"
rev = "a8c3192e0cc3661200fe9bab482bbb1b9d47434b"
