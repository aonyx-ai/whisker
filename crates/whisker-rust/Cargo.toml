[package]
name = "whisker-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The rust-analyzer stack behind the decoration provider dwarfs everything
# else in this crate. Custom lint plugins depend on this crate only for the
# generated trait, the adapter, and the decoration types, so the provider is
# a default feature they can switch off rather than an unconditional cost.
[features]
default = ["provider"]
provider = [
  "dep:anyhow",
  "dep:ra_ap_hir",
  "dep:ra_ap_ide_db",
  "dep:ra_ap_load-cargo",
  "dep:ra_ap_project_model",
  "dep:ra_ap_syntax",
  "dep:ra_ap_vfs",
]

[dependencies]
anyhow = { workspace = true, optional = true }
ra_ap_hir = { workspace = true, optional = true }
ra_ap_ide_db = { workspace = true, optional = true }
ra_ap_load-cargo = { workspace = true, optional = true }
ra_ap_project_model = { workspace = true, optional = true }
ra_ap_syntax = { workspace = true, optional = true }
ra_ap_vfs = { workspace = true, optional = true }
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
whisker-types.workspace = true

[dev-dependencies]
# The lint crates depend on this one, so the two lint entries below close a
# cycle. Cargo permits that for dev-dependencies. The cycle lets the
# integration tests assert on diagnostics that real lints draw from real
# decorations, not on the decorations alone.
anyhow_missing_context = { path = "../../lints/anyhow_missing_context" }
proptest.workspace = true
whisker-core.workspace = true
wildcard_match_arm = { path = "../../lints/wildcard_match_arm" }

[build-dependencies]
whisker-codegen.workspace = true

[lints]
workspace = true
