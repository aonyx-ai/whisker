[package]
name = "whisker-rust"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
ra_ap_hir.workspace = true
ra_ap_ide_db.workspace = true
ra_ap_load-cargo.workspace = true
ra_ap_project_model.workspace = true
ra_ap_syntax.workspace = true
ra_ap_vfs.workspace = true
tree-sitter.workspace = true
tree-sitter-rust.workspace = true
whisker-types.workspace = true

[dev-dependencies]
# The lint crates depend on this one, so these edges close a cycle. Cargo
# permits that for dev-dependencies, and it is what lets the provider's
# integration tests assert on the diagnostics real lints draw from real
# decorations, rather than on decorations alone.
anyhow_missing_context = { path = "../../lints/anyhow_missing_context" }
proptest.workspace = true
whisker-core.workspace = true
wildcard_match_arm = { path = "../../lints/wildcard_match_arm" }

[build-dependencies]
whisker-codegen.workspace = true

[lints]
workspace = true
