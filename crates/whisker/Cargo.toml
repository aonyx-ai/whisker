[workspace]

[package]
name = "whisker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/aonyx-ai/whisker.git"
publish = false

[[bin]]
name = "whisker"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clawless = "0.5.0"
walkdir = "2"
whisker-core = { path = "../whisker-core" }
whisker-reporting = { path = "../whisker-reporting" }
whisker-rust = { path = "../whisker-rust" }
whisker-types = { path = "../whisker-types" }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
trycmd = "0.15"
