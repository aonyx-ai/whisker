[workspace]
members = ["crates/*"]
exclude = [
  "crates/whisker-rust/tests/fixtures/lints/decoration_probes",
  "examples/*",
]

# Opt-in to the new feature resolver introduced in Rust 1.85 and Edition 2024.
# https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

license = "Apache-2.0 OR MIT"
repository = "https://github.com/aonyx-ai/whisker.git"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"

# The tests run rust-analyzer far more than they compile it.
[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
anyhow = "1"
codespan-reporting = "0.13"
# Finds the directory whisker keeps fetched lint sources in. etcetera rather
# than `dirs` or `directories`, because whisker wants the XDG layout on every
# platform: a cache under `~/Library/Caches` on macOS would sit apart from the
# one a container or a continuous integration job restores.
etcetera = "0.11"
# Fetches git-sourced lint plugins. Gitoxide rather than the git CLI so that
# whisker's own behavior does not depend on which git a machine has, or on
# whether it has one; the fetch asks the remote for the single pinned commit
# and nothing else.
#
# The feature list is the smallest one that fetches and checks out. `parallel`
# is on that list because it makes gitoxide's object store shareable between
# threads, which the checkout requires. `max-performance-safe` would add it
# along with pack caches that buy nothing here — one shallow fetch of one
# commit — so the feature is named directly instead.
#
# `gix::url` also reads the remote a lint entry names, so the configuration and
# the fetch agree on what a remote is. Whisker took that parser from `gix-url`
# directly until gitoxide 0.87 moved the two crates apart, and a remote parsed
# by one version cannot be handed to a fetch built on the other.
gix = { version = "0.87", default-features = false, features = [
  "blocking-network-client",
  "blocking-http-transport-reqwest-rust-tls",
  "worktree-mutation",
  "index",
  "parallel",
  "sha1",
] }
# The walker behind ripgrep. Whisker uses it instead of a plain directory walk
# so that `.gitignore` and friends are honored: a linter that reports on
# generated output such as `target/` is worse than no linter at all.
ignore = "0.4"
# Finds the project a `whisker check` run targets, and reads the
# configuration file at the top of it. Whisker used to walk the directory
# tree itself. The crate does the same walk, but it is the walk every Aonyx
# tool does, so `.config/whisker.toml` sits where a user already expects a
# tool's configuration to sit, and a broken file is reported in the same
# words with the same line and column.
kawauso-project = "0.2.0"
# Loads custom lint plugins. The loader trusts a library only after the
# handshake in whisker-types::plugin proves it was built by the same rustc
# from the same whisker source.
libloading = "0.9"
proptest = "1"
ra_ap_hir = "0.0.349"
ra_ap_ide_db = "0.0.349"
ra_ap_load-cargo = "0.0.349"
ra_ap_project_model = "0.0.349"
ra_ap_syntax = "0.0.349"
ra_ap_vfs = "0.0.349"
proc-macro2 = "1"
quote = "1"
# Read by build scripts to bake the compiler's identity into the plugin
# handshake: whisker refuses to load a custom lint plugin built by a
# different rustc, because Rust's ABI is only coherent within one compiler.
rustc_version = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "extra-traits"] }
tempfile = "3"
toml = "1"
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
whisker-core = { path = "crates/whisker-core", version = "=0.1.0" }
whisker-macros = { path = "crates/whisker-macros", version = "=0.1.0" }
whisker-codegen = { path = "crates/whisker-codegen", version = "=0.1.0" }
whisker-reporting = { path = "crates/whisker-reporting", version = "=0.1.0" }
whisker-rust = { path = "crates/whisker-rust", version = "=0.1.0" }
whisker-types = { path = "crates/whisker-types", version = "=0.1.0" }
whisker-testing = { path = "crates/whisker-testing", version = "=0.1.0" }
