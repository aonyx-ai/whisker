[workspace]
members = ["crates/*", "lints/*"]
exclude = ["examples/*", "crates/whisker"]

# Opt-in to the new feature resolver introduced in Rust 1.85 and Edition 2024.
# https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

license = "Apache-2.0 OR MIT"
repository = "https://github.com/aonyx-ai/whisker.git"

[workspace.metadata.dylint]
libraries = [{ path = ".", pattern = "lints/*" }]

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[workspace.dependencies]
clippy_utils = "=0.1.96"
dylint_linting = "6.0.0"
dylint_testing = "6.0.0"
whisker_testing = { path = "crates/whisker_testing", version = "=0.1.0" }
anyhow = "1"
proptest = "1"
whisker-types = { path = "crates/whisker-types", version = "=0.1.0" }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
whisker-macros = { path = "crates/whisker-macros", version = "=0.1.0" }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
whisker-core = { path = "crates/whisker-core", version = "=0.1.0" }
codespan-reporting = "0.13"
whisker-reporting = { path = "crates/whisker-reporting", version = "=0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
whisker-codegen = { path = "crates/whisker-codegen", version = "=0.1.0" }
whisker-rust = { path = "crates/whisker-rust", version = "=0.1.0" }
whisker-testing = { path = "crates/whisker-testing", version = "=0.1.0" }
